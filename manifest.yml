modules:
  jira:issuePanel:
    - key: onboarding-issue-panel
      resource: onboarding-panel
      resolver:
        function: panelResolver
      title: Przewodnik dla nowych pracowników
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:adminPage:
    - key: onboarding-admin-page
      resource: admin-page
      resolver:
        function: adminResolver
      title: Ustawienia samouczka onboardingowego
      icon: https://developer.atlassian.com/platform/forge/images/icons/global-page-icon.svg

  jira:personalSettingsPage:
    - key: onboarding-my-progress
      resource: my-progress
      resolver:
        function: panelResolver
      title: Moj postep w onboardingu

  jiraServiceManagement:portalRequestCreatePropertyPanel:
    - key: onboarding-portal-request-panel
      resource: portal-request-panel
      resolver:
        function: portalResolver
      title: Jak poprawnie zglosic prosbe

  webtrigger:
    - key: onboarding-steps-webtrigger
      function: webTriggerHandler
    - key: atlassian-oauth-exchange
      function: atlassianOAuthExchangeHandler
    - key: onboarding-report
      function: onboardingReportHandler

  function:
    - key: panelResolver
      handler: index.panelHandler
    - key: adminResolver
      handler: index.adminHandler
    - key: portalResolver
      handler: index.portalHandler
    - key: webTriggerHandler
      handler: index.webTriggerHandler
    - key: atlassianOAuthExchangeHandler
      handler: index.atlassianOAuthExchangeHandler
    - key: onboardingReportHandler
      handler: index.onboardingReportHandler

resources:
  - key: onboarding-panel
    path: static/onboarding-panel/build
  - key: admin-page
    path: static/admin-page/build
  - key: my-progress
    path: static/my-progress/build
  - key: portal-request-panel
    path: static/portal-request-panel/build

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs20.x

permissions:
  scopes:
    - storage:app
    - read:jira-user
  external:
    fetch:
      backend:
        - auth.atlassian.com
        - api.atlassian.com
        - login.microsoftonline.com
  content:
    styles:
      - unsafe-inline
