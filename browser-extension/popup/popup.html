<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Samouczek onboardingowy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <h1>Samouczek Jira</h1>

      <div id="auth-section" hidden>
        <p id="auth-status" class="status"></p>
        <div id="auth-signed-out">
          <button id="signin-microsoft" class="btn btn--primary">Zaloguj przez Microsoft</button>
          <button id="signin-atlassian" class="btn btn--primary">Zaloguj przez Atlassian</button>
        </div>
        <button id="signout" class="btn btn--subtle" hidden>Wyloguj</button>
        <p id="auth-error" class="hint"></p>
      </div>

      <div id="tour-section">
        <p id="status" class="status">Sprawdzanie statusu...</p>
        <div id="tours-list"></div>
        <button id="options" class="btn btn--subtle">Ustawienia samouczków</button>
      </div>
    </div>

    <template id="tour-row-template">
      <div class="tour-row">
        <span class="tour-row__title"></span>
        <span class="tour-row__status"></span>
        <button type="button" class="btn btn--subtle tour-row__restart">Uruchom</button>
      </div>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
